name: Phase 50A PostgreSQL Conformance

# Runs the Phase 50A canonical-store proof against TWO separate PostgreSQL
# server instances (ADR-049Q §13.1(c), (i)).
#
# Non-production only (§13.2). This workflow provisions nothing outside the
# runner, contacts no provider, holds no production credential, and touches no
# living estate. The two services below are ephemeral upstream `postgres`
# containers on the runner, and the credentials are the same fixed local-only
# values the checked-in harness uses.
#
# Scope note: this is a NEW, self-contained workflow. It does not modify — and
# holds no permission over — the Straylight control-plane workflows.

# ── R3: the trigger set MIRRORS the checked-in proof-input manifest ──────
#
# `tests/phase-50a/proof-input-manifest.json` is the single declaration of every
# path whose content can change this workflow's suites' verdicts. The filters
# below cover exactly those roots, and
# `tests/phase-50a/proof-input-coverage.test.ts` proves it by comparing the
# manifest against a BOUNDED STRUCTURAL PARSE of this file's own bytes. The
# required set of uncovered manifest roots is EMPTY, and there is no exception
# mechanism of any kind.
#
# The roots are BROAD (`src/straylight/**`, not a file list) on purpose: a broad
# filter also covers files that do not exist yet, so coverage cannot be defeated
# by adding, renaming, or deleting a declaration. `tests/phase-50a/**` covers the
# manifest itself and every proof file that consumes it, so a change to the
# coverage model cannot merge without running this workflow.
#
# Adding a proof input means adding a root to the MANIFEST and a matching filter
# here. Neither side is derived from the other; the test compares them.
on:
  pull_request:
    paths:
      - 'src/straylight/**'
      - 'migrations/postgres/**'
      - 'scripts/phase-50a/**'
      - 'tests/phase-50a/**'
      - 'tests/storage-conformance.test.ts'
      - 'docker-compose.phase-50a.yml'
      - '.github/workflows/phase-50a-postgres-conformance.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/PHASE-50A-PROVIDER-NEUTRAL-POSTGRESQL-CANONICAL-STORE-IMPLEMENTATION-AND-PROOF.md'
      - 'docs/runbooks/**'
  # A BOUNDED manual exact-head path: the only input is the 40-hex commit SHA to
  # check out and assert. Nothing else is parameterizable, so a dispatch cannot
  # redirect the proof at a different repository, ref, or configuration.
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Exact 40-hex commit SHA to check out and assert (required)'
        required: true
        type: string

# Least privilege: read the code and read the private package registry.
# No contents:write, no issues:write, no pull-requests:write, no packages:write.
#
# `packages: read` exists solely so `npm ci` can resolve the private
# `@0xhoneyjar/loa-hounfour` dependency from GitHub Packages using the
# EPHEMERAL, job-scoped `GITHUB_TOKEN`. No credential is committed, printed,
# persisted, or transformed, and the token is exposed to the install step
# only (see "Install dependencies" below).
permissions:
  contents: read
  packages: read

concurrency:
  group: phase-50a-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-proof:
    name: Canonical store — two-host proof
    runs-on: ubuntu-latest

    # TWO separately initialized PostgreSQL servers, on two different ports.
    # Not one server with two databases: §13.1(i) requires the restore to land
    # in a different conforming host, and the proof mechanically verifies the
    # two clusters report different system identifiers.
    services:
      source:
        image: postgres:16
        env:
          POSTGRES_USER: straylight_proof
          POSTGRES_PASSWORD: straylight_local_proof_only
          POSTGRES_DB: straylight_source
        ports:
          - 55432:5432
        options: >-
          --name straylight-phase-50a-source
          --health-cmd "pg_isready -U straylight_proof -d straylight_source"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      replacement:
        image: postgres:16
        env:
          POSTGRES_USER: straylight_proof
          POSTGRES_PASSWORD: straylight_local_proof_only
          POSTGRES_DB: straylight_replacement
        ports:
          - 55433:5432
        options: >-
          --name straylight-phase-50a-replacement
          --health-cmd "pg_isready -U straylight_proof -d straylight_replacement"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      # ── EXACT-HEAD GIT IDENTITY (R3) ────────────────────────────────────
      #
      # The audit of the previous attempt found that `actions/checkout` had
      # fetched `refs/pull/<n>/merge` and executed GitHub's SYNTHETIC MERGE
      # COMMIT, not the audited head. The two trees were byte-identical, so the
      # run was valid evidence of RUNTIME CONTENT — but it was not exact-head
      # Git identity evidence, which the packet required.
      #
      # The three steps below close that:
      #
      #   1. DERIVE the target SHA — the `workflow_dispatch` input on a manual
      #      run, `github.event.pull_request.head.sha` on a pull-request run (the
      #      ACTUAL PR head, never the synthetic merge SHA) — and validate it
      #      against ^[0-9a-f]{40}$, failing closed on anything else.
      #   2. CHECK OUT that exact SHA as the `ref`.
      #   3. ASSERT `git rev-parse HEAD` equals it, before any substantive step.
      #
      # Nothing substantive runs before step 3 succeeds: no install, no build, no
      # typecheck, no test, no suite, no proof, no artifact verification.
      - name: Derive and validate the exact target head SHA
        id: target
        env:
          # Read through the environment, never interpolated into the script
          # body: a `${{ }}` expansion inside `run:` is executed as shell text.
          DISPATCH_SHA: ${{ inputs.head_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) target="$DISPATCH_SHA" ;;
            pull_request)      target="$PR_HEAD_SHA" ;;
            *)
              echo "phase-50a: unsupported event '$EVENT_NAME'; refusing to run" >&2
              exit 1
              ;;
          esac
          if [ -z "$target" ]; then
            echo "phase-50a: no target head SHA available for event '$EVENT_NAME'" >&2
            exit 1
          fi
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "phase-50a: target head SHA '$target' is not a 40-hex commit id" >&2
            exit 1
          fi
          echo "phase-50a: exact target head SHA = $target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout the EXACT target head SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The exact commit, NOT refs/pull/<n>/merge. A synthetic merge commit is
          # not exact-head identity evidence even when its tree is identical.
          ref: ${{ steps.target.outputs.sha }}
          submodules: recursive

      - name: Assert git rev-parse HEAD equals the exact target head SHA
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "phase-50a: expected HEAD = $TARGET_SHA"
          echo "phase-50a: git rev-parse HEAD = $actual"
          if [ "$actual" != "$TARGET_SHA" ]; then
            echo "phase-50a: HEAD does not equal the exact target head SHA; refusing to run" >&2
            exit 1
          fi
          echo "phase-50a: EXACT-HEAD IDENTITY CONFIRMED at $actual"

      # `registry-url` + `scope` make setup-node write a runner-local .npmrc
      # that points the @0xhoneyjar scope at GitHub Packages and reads its
      # credential from NODE_AUTH_TOKEN at install time. The repository's own
      # .npmrc is untouched (it is a forbidden path for this packet), and no
      # credential is written into the tree.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@0xhoneyjar'

      # The ONLY step that receives a token, and it receives the ephemeral,
      # job-scoped workflow identity — never a PAT, never a committed
      # credential. It is consumed by npm's registry auth and is never echoed,
      # written to a file in the tree, exported to a later step, or
      # transformed. There is deliberately NO fallback registry: if package
      # authorization is unavailable the install FAILS rather than silently
      # resolving the dependency from somewhere else.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm two distinct PostgreSQL instances
        run: |
          docker exec straylight-phase-50a-source \
            psql -tA -U straylight_proof -d straylight_source \
            -c 'SELECT system_identifier FROM pg_control_system()'
          docker exec straylight-phase-50a-replacement \
            psql -tA -U straylight_proof -d straylight_replacement \
            -c 'SELECT system_identifier FROM pg_control_system()'

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Existing test suite (unchanged adapters must not regress)
        run: npm test

      - name: Control-plane validation
        run: npm run control-plane:validate

      - name: Control-plane tests
        run: npm run control-plane:test

      # Requires both instances. Fails — never skips — if either is unreachable.
      - name: Phase 50A PostgreSQL suites
        run: npm run phase-50a:test

      - name: Phase 50A two-host export/restore/replacement proof
        run: npm run phase-50a:proof

      # Complete-tree and package reproducibility under the INTERNAL-ONLY
      # EXCLUSION contract.
      #
      # The PostgreSQL store is internal: it is not exported from
      # src/straylight/index.ts, has no package subpath, and its declarations
      # are therefore NOT package artifacts. `npm run build` prunes them, and
      # this step proves the result exactly — the generated dist-types tree
      # equals the tracked tree, and `npm pack --dry-run --json` ships neither
      # an untracked file nor any PostgreSQL declaration.
      #
      # This REPLACES the earlier assertion, which only checked that tracked
      # files were unchanged and explicitly tolerated ("blessed") the 12
      # untracked PostgreSQL declarations that `npm pack` then packed. Refusing
      # them is the point: see scripts/phase-50a/verify-generated-artifact.mjs
      # for the C1..C9 clauses this enforces.
      - name: Confirm complete generated tree and package are reproducible
        run: npm run phase-50a:verify-artifact

      - name: Confirm no whitespace damage
        run: git diff --check
