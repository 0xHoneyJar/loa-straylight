# Straylight Control Plane v1 — shadow merge guard.
#
# Authority: docs/decisions/ADR-050-autonomous-execution-control-plane.md
#
# Validates merge ELIGIBILITY (state ready-for-merge, verdict ACCEPT,
# audited SHA == current head SHA, required checks green, no operator
# pause, policy sane) and posts a shadow-mode result.
#
# THIS WORKFLOW CANNOT MERGE. It contains no merge API invocation of any
# shape (REST, CLI, or GraphQL), no branch mutation of any kind, and its
# token is read-only for repository contents — GitHub would reject a merge
# attempt even if the code were compromised. Enabling automatic merge
# requires a future ADR,
# a separately audited authorization, and distinct actor identities
# (ADR-050 §6) — not a change to this file's conditions.

name: Straylight CP Merge Guard

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Lane issue number to evaluate"
        required: true

# contents:read       — checkout of protocol code.
# issues:write        — post the shadow result on the lane issue.
# pull-requests:read  — read PR head SHA + check states (never write).
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: straylight-merge-guard-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Pin to main, NOT the dispatched ref: the canonical policy gate,
          # the committed automation policy, and all protocol/reconstruction
          # code must come from CURRENT MAIN. A manual dispatch selecting an
          # older or non-main ref must never make this workflow evaluate an
          # older enabled policy or older control-plane code (same posture
          # as bootstrap's B10 hardening).
          ref: main
          # Repo convention (issue #669): keep recursive submodule checkout
          # so .claude symlinks into .loa never dangle on runners.
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # POLICY AUTHORITY: the canonical executable gate (policy-gate.mjs →
      # validatePolicy) validates the COMPLETE committed policy on LITERAL
      # BOOLEANS before this workflow performs any network or mutation
      # action (it posts a shadow-result comment). Exit 0 = valid + enabled
      # → proceed. Exit 3 = valid kill switch → take no action (post
      # nothing). Anything else = malformed policy → FAIL CLOSED loudly.
      - name: Kill switch check (canonical policy gate)
        run: |
          set -euo pipefail
          set +e
          node .straylight/bin/policy-gate.mjs
          GATE=$?
          set -e
          if [[ "$GATE" -eq 3 ]]; then
            echo "Automation disabled (valid kill switch). Merge guard taking no action."
            exit 1
          elif [[ "$GATE" -ne 0 ]]; then
            echo "::error::automation policy failed validation (policy-gate exit ${GATE}); failing closed — a malformed policy is neither enabled nor a valid kill switch"
            exit 1
          fi

      - name: Reconstruct lane
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" > /tmp/issue.json
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate > /tmp/comments.json
          jq -n --slurpfile issue /tmp/issue.json --slurpfile comments /tmp/comments.json \
            '{issue_body: $issue[0].body,
              comments: ($comments | add // [] | map({id: .id, user: .user.login, body: .body, created_at: .created_at, updated_at: .updated_at}))}' \
            > /tmp/reduce-input.json
          node .straylight/bin/reduce-issue.mjs --input /tmp/reduce-input.json > /tmp/lane-result.json
          jq '.lane' /tmp/lane-result.json > /tmp/lane.json

      - name: Gather complete live PR metadata and check status (fail closed on absence)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PRNUM=$(jq -r '.pr_number // empty' /tmp/lane.json)
          HEAD=""
          # COMPLETE normalized metadata only: one fetch of the PR object is
          # normalized into the same validatePrMetadata record the reducer
          # workflow embeds in system.eligibility_confirmed events. Every
          # field must be PRESENT with its expected type (draft/merged as
          # literal booleans, never defaulted) or the record collapses to
          # {fetch_ok:false} and the pure module fails closed. No loose
          # single-field forwarding: partial evidence is unknown, and
          # unknown is ineligible.
          CHECKS_JSON="null"
          PR_META='{"fetch_ok": false}'
          if [[ "$PRNUM" =~ ^[0-9]+$ ]]; then
            if gh api "repos/${REPO}/pulls/${PRNUM}" > /tmp/pr.json 2>/dev/null; then
              PR_META=$(jq --arg repo "$REPO" '
                . as $p
                | if (($p.draft|type) == "boolean" and ($p.merged|type) == "boolean"
                      and (($p.number)|type) == "number" and (($p.state)|type) == "string"
                      and (($p.base.ref)|type) == "string" and (($p.base.sha)|type) == "string"
                      and (($p.head.ref)|type) == "string" and (($p.head.sha)|type) == "string")
                  then {
                    fetch_ok: true,
                    repository: $repo,
                    pr_number: $p.number,
                    state: $p.state,
                    draft: $p.draft,
                    merged: $p.merged,
                    base_branch: $p.base.ref,
                    base_sha: $p.base.sha,
                    head_branch: $p.head.ref,
                    head_sha: $p.head.sha
                  }
                  else { fetch_ok: false }
                  end' /tmp/pr.json)
              HEAD=$(jq -r 'if .fetch_ok == true then .head_sha else "" end' <<< "$PR_META")
            fi
            if [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              # Modern check runs on the head: aggregate EVERY page's runs into
              # one conclusion list (--paginate emits one JSON document per
              # page; slurp + flatten joins them). The pure module cross-checks
              # the list length against total_count, so a dropped page (or this
              # aggregation ever regressing to page 1 only) fails closed
              # instead of passing on partial evidence. In-progress runs have
              # conclusion null → recorded as "null" (non-passing).
              CR_TOTAL=$(gh api "repos/${REPO}/commits/${HEAD}/check-runs" -q '.total_count' 2>/dev/null || echo "")
              CR_CONCLUSIONS="null"
              if gh api --paginate "repos/${REPO}/commits/${HEAD}/check-runs" > /tmp/check-pages.json 2>/dev/null; then
                CR_CONCLUSIONS=$(jq -s '[.[].check_runs[] | (.conclusion // "null")]' /tmp/check-pages.json)
              fi
              # Legacy combined commit status (the check-runs API does not
              # surface these; branch protection may still require them).
              CS_STATE=$(gh api "repos/${REPO}/commits/${HEAD}/status" -q '.state' 2>/dev/null || echo "")
              CS_TOTAL=$(gh api "repos/${REPO}/commits/${HEAD}/status" -q '.total_count' 2>/dev/null || echo "")
              if [[ "$CR_TOTAL" =~ ^[0-9]+$ && "$CR_CONCLUSIONS" != "null" && "$CS_TOTAL" =~ ^[0-9]+$ && -n "$CS_STATE" ]]; then
                CHECKS_JSON=$(jq -n \
                  --argjson crt "$CR_TOTAL" --argjson crc "$CR_CONCLUSIONS" \
                  --argjson cst "$CS_TOTAL" --arg css "$CS_STATE" \
                  '{check_runs_total: $crt, check_run_conclusions: $crc, commit_statuses_total: $cst, commit_status_state: $css}')
              fi
            fi
          fi
          jq -n --slurpfile lane /tmp/lane.json --argjson checks "$CHECKS_JSON" \
            --argjson prmeta "$PR_META" \
            '{lane: $lane[0],
              context: ((if $checks != null then {checks: $checks} else {} end)
                        + {pr_metadata: $prmeta})}' \
            > /tmp/guard-input.json

      - name: Evaluate shadow eligibility
        run: |
          set -euo pipefail
          node .straylight/bin/merge-guard-check.mjs --input /tmp/guard-input.json > /tmp/guard-result.json
          cat /tmp/guard-result.json

      - name: Post shadow result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ELIGIBLE=$(jq -r '.eligible' /tmp/guard-result.json)
          SEQ=$(jq -r '.event_sequence // "na"' /tmp/lane.json)
          HEAD=$(jq -r '.context.pr_metadata.head_sha // "unknown"' /tmp/guard-input.json)
          DEDUPE="merge-guard:${SEQ}:${HEAD}:${ELIGIBLE}"
          # Only a genuine bot-authored merge-guard-result comment counts as
          # "already posted" — restrict the scan to github-actions[bot]
          # authorship AND the merge-guard-result marker so a third party
          # cannot suppress this shadow report by planting the dedupe string
          # in an ordinary comment (B8 uniform hardening).
          if gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | test("<!-- straylight:merge-guard-result:v1 -->")) | .body' \
              | grep -qF "dedupe:${DEDUPE}"; then
            echo "already posted ${DEDUPE}; skipping"
            exit 0
          fi
          {
            echo "## Straylight merge guard — SHADOW RESULT (cannot merge)"
            echo ""
            echo "dedupe:${DEDUPE}"
            echo ""
            echo "Eligibility: **${ELIGIBLE}** — this is a report, not an action."
            echo "Merging remains an exclusive \`operator:eileen\` action."
            echo ""
            echo "<!-- straylight:merge-guard-result:v1 -->"
            echo '```json'
            cat /tmp/guard-result.json
            echo '```'
          } > /tmp/comment.md
          gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --input <(jq -n --rawfile body /tmp/comment.md '{body: $body}')
