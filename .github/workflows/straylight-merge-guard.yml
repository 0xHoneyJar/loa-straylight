# Straylight Control Plane v1 — shadow merge guard.
#
# Authority: docs/decisions/ADR-050-autonomous-execution-control-plane.md
#
# Validates merge ELIGIBILITY (state ready-for-merge, verdict ACCEPT,
# audited SHA == current head SHA, required checks green, no operator
# pause, policy sane) and posts a shadow-mode result.
#
# THIS WORKFLOW CANNOT MERGE. It contains no merge API invocation of any
# shape (REST, CLI, or GraphQL), no branch mutation of any kind, and its
# token is read-only for repository contents — GitHub would reject a merge
# attempt even if the code were compromised. Enabling automatic merge
# requires a future ADR,
# a separately audited authorization, and distinct actor identities
# (ADR-050 §6) — not a change to this file's conditions.
#
# WORKFLOW-BOUNDARY CONTRACT (rev. 3 §11): bash here is confined to
# fetching bytes to files (TWICE — the two-read stability fence),
# switching on validated exit codes, and invoking the planner
# (plan-merge-guard-write.mjs — evidence parsing with N1/N2 profiles,
# the universal lane-target proof, pure merge-guard evaluation, exact
# dedupe) and the shared secure executor (execute-write-plan.mjs). Bash
# never constructs a write request and never interprets evidence content.

name: Straylight CP Merge Guard

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Lane issue number to evaluate"
        required: true

# contents:read       — checkout of protocol code.
# issues:write        — post the shadow result on the lane issue (used
#                       ONLY through the shared executor).
# pull-requests:read  — read PR head SHA + check states (never write).
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: straylight-merge-guard-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Pin to main, NOT the dispatched ref: the canonical policy gate,
          # the committed automation policy, and all protocol/reconstruction
          # code must come from CURRENT MAIN. A manual dispatch selecting an
          # older or non-main ref must never make this workflow evaluate an
          # older enabled policy or older control-plane code (same posture
          # as bootstrap's B10 hardening).
          ref: main
          # Repo convention (issue #669): keep recursive submodule checkout
          # so .claude symlinks into .loa never dangle on runners.
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # POLICY AUTHORITY: the canonical executable gate (policy-gate.mjs →
      # validatePolicy) validates the COMPLETE committed policy on LITERAL
      # BOOLEANS before this workflow performs any network or mutation
      # action. Exit 0 = valid + enabled → proceed. Exit 3 = valid kill
      # switch → take no action. Anything else = malformed policy → FAIL
      # CLOSED loudly.
      - name: Kill switch check (canonical policy gate)
        run: |
          set -euo pipefail
          set +e
          node .straylight/bin/policy-gate.mjs
          GATE=$?
          set -e
          if [[ "$GATE" -eq 3 ]]; then
            echo "Automation disabled (valid kill switch). Merge guard taking no action."
            exit 1
          elif [[ "$GATE" -ne 0 ]]; then
            echo "::error::automation policy failed validation (policy-gate exit ${GATE}); failing closed — a malformed policy is neither enabled nor a valid kill switch"
            exit 1
          fi

      # FETCH ONLY, TWICE: two complete independent reads for the
      # stability fence. Raw bytes go straight to files; the PLANNERS own
      # all parsing, binding, reconstruction, and eligibility logic. Fetch
      # targets are DERIVED outputs only: the PR number comes from the
      # reducer planner's --probe (the shared reconstruction authority),
      # and the head SHA for check evidence comes from evidence.mjs's
      # bound parse of the just-fetched PR bytes — bash never extracts a
      # field from raw evidence itself. PR/check/status evidence is
      # optional on disk (a failed fetch is recorded by absence; the pure
      # module fails closed downstream), but a failed ENUMERATION or
      # issue/comment fetch aborts loudly.
      - name: Gather evidence twice (raw bytes to files)
        id: gather
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gather_once() {
            local DIR="$1"
            if ! gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" > "${DIR}/enumeration.pages"; then
              echo "::error::enumeration failed (gh api non-zero); aborting — NOT treating as zero lanes"
              exit 1
            fi
            if ! gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" > "${DIR}/issue.json"; then
              echo "::error::issue fetch failed; aborting"
              exit 1
            fi
            if ! gh api --paginate "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" > "${DIR}/comments.pages"; then
              echo "::error::comment fetch failed; aborting — NOT treating as zero comments"
              exit 1
            fi
          }
          # Derived read: the bound head SHA of an already-fetched PR file,
          # parsed by evidence.mjs (never by bash/jq over raw bytes).
          # Prints nothing when the file is absent or fails binding.
          derived_head() {
            local DIR="$1" PRNUM="$2"
            [[ -f "${DIR}/pr.json" ]] || return 0
            PR_FILE="${DIR}/pr.json" PR_NUM="$PRNUM" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const { parsePr } = await import("./.straylight/lib/evidence.mjs");
              const r = parsePr(readFileSync(process.env.PR_FILE, "utf8"), {
                repository: process.env.REPO, pr_number: Number(process.env.PR_NUM),
              });
              if (r.ok) process.stdout.write(r.pr.head_sha);
            ' 2>/dev/null || true
          }
          fetch_pr_evidence() {
            local DIR="$1" PRNUM="$2"
            if ! gh api "repos/${REPO}/pulls/${PRNUM}" > "${DIR}/pr.json" 2>/dev/null; then
              rm -f "${DIR}/pr.json"
              return 0
            fi
            local HEAD
            HEAD=$(derived_head "${DIR}" "$PRNUM")
            if [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]; then
              gh api --paginate "repos/${REPO}/commits/${HEAD}/check-runs" > "${DIR}/check-runs.pages" 2>/dev/null || rm -f "${DIR}/check-runs.pages"
              gh api "repos/${REPO}/commits/${HEAD}/status" > "${DIR}/status.json" 2>/dev/null || rm -f "${DIR}/status.json"
            fi
          }
          G1=$(mktemp -d); G2=$(mktemp -d)
          echo "g1=${G1}" >> "$GITHUB_OUTPUT"
          echo "g2=${G2}" >> "$GITHUB_OUTPUT"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "now=${NOW}" >> "$GITHUB_OUTPUT"
          gather_once "${G1}"
          # DERIVED probe over read 1 (reducer planner --probe: two-read
          # fence trivially satisfied by the same read twice, lane-target
          # proof, reconstruction) to learn which PR to fetch.
          set +e
          PROBE=$(node .straylight/bin/plan-reducer-writes.mjs --stage a --probe \
            --gather-1 "${G1}" --gather-2 "${G1}" \
            --issue-number "${ISSUE_NUMBER}" \
            --repository "${REPO}" --nonce "${NONCE}" --now "${NOW}")
          PROBE_EXIT=$?
          set -e
          if [[ "$PROBE_EXIT" -ne 0 ]]; then
            echo "::error::evidence probe refused (exit ${PROBE_EXIT}); failing closed"
            echo "$PROBE"
            exit 1
          fi
          PRNUM=$(echo "$PROBE" | jq -r '.pr_number // empty')
          if [[ "$PRNUM" =~ ^[0-9]+$ ]]; then
            fetch_pr_evidence "${G1}" "$PRNUM"
          fi
          gather_once "${G2}"
          if [[ "$PRNUM" =~ ^[0-9]+$ ]]; then
            fetch_pr_evidence "${G2}" "$PRNUM"
          fi

      # PLAN: two-read fence, lane-target proof, pure evaluation, exact
      # dedupe — all planner authority. Exit 3 = already posted (valid
      # no-op); exit 2 = refusal, zero writes.
      - name: Plan shadow result (planner authority)
        id: plan
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          REQUEST_ROOT=$(mktemp -d)
          echo "request_root=${REQUEST_ROOT}" >> "$GITHUB_OUTPUT"
          set +e
          node .straylight/bin/plan-merge-guard-write.mjs \
            --gather-1 "${{ steps.gather.outputs.g1 }}" \
            --gather-2 "${{ steps.gather.outputs.g2 }}" \
            --issue-number "${ISSUE_NUMBER}" \
            --request-root "${REQUEST_ROOT}" \
            --repository "${REPO}" \
            --nonce "${NONCE}" \
            --now "${{ steps.gather.outputs.now }}"
          PLAN=$?
          set -e
          if [[ "$PLAN" -eq 3 ]]; then
            echo "shadow result already posted; nothing to do"
            echo "outcome=noop" >> "$GITHUB_OUTPUT"
          elif [[ "$PLAN" -eq 0 ]]; then
            echo "outcome=plan" >> "$GITHUB_OUTPUT"
          else
            echo "::error::merge-guard planner refused (exit ${PLAN}); failing closed — zero writes"
            exit 1
          fi

      # EXECUTE: one invocation of the shared secure executor per plan.
      - name: Execute write plan (single shared executor)
        if: steps.plan.outputs.outcome == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          REQUEST_ROOT: ${{ steps.plan.outputs.request_root }}
        run: |
          set -euo pipefail
          node .straylight/bin/execute-write-plan.mjs \
            --plan "${REQUEST_ROOT}/plan.json" \
            --request-root "${REQUEST_ROOT}" \
            --repository "${REPO}" \
            --nonce "${NONCE}"
