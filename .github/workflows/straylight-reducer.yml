# Straylight Control Plane v1 — reducer (shadow mode).
#
# Authority: docs/decisions/ADR-050-autonomous-execution-control-plane.md
# Protocol:  .straylight/README.md
#
# Mechanical only: fetches the lane issue + comments via the GitHub API,
# runs the pure reducer, syncs derived cp-* labels, and posts a
# machine-readable reducer result. Makes NO semantic decisions, calls NO
# model API, and holds NO contents:write.
#
# Security posture:
#   - permissions: contents:read + issues:write + pull-requests:read only
#     (documented below);
#   - issue/comment bodies are UNTRUSTED: they travel API -> jq -> file ->
#     Node JSON.parse; they are never interpolated into shell commands;
#   - first-party actions pinned to immutable commit SHAs;
#   - triggers avoid the privileged PR-target event class entirely;
#   - concurrency per issue so two reducer runs cannot race one lane.

name: Straylight CP Reducer

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Lane issue number to reduce"
        required: true

# contents:read       — checkout of .straylight/ protocol code (and .loa
#                       submodule for repo consistency; no Loa script runs).
# issues:write        — sync derived cp-* labels + post the reducer result.
# pull-requests:read  — read the lane PR's live head SHA for exact-SHA audit
#                       binding (read-only; the reducer fails closed without
#                       it, but head verification then cannot function).
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: straylight-reducer-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  reduce:
    # Only lanes: cp-lane label (or explicit manual dispatch). Bots' own
    # result comments carry no straylight:event marker, so reducing on them
    # is a no-op, but skip github-actions comments outright to avoid loops.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'cp-lane')) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.issue.labels.*.name, 'cp-lane') &&
       github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Pin to main, NOT the dispatched ref: the canonical policy gate,
          # the committed automation policy, and all protocol/reconstruction
          # code must come from CURRENT MAIN. A manual dispatch selecting an
          # older or non-main ref must never make this workflow evaluate an
          # older enabled policy or older control-plane code (same posture
          # as bootstrap's B10 hardening).
          ref: main
          # Repo convention (issue #669): keep recursive submodule checkout
          # so .claude symlinks into .loa never dangle on runners.
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Kill switch (ADR-050 §4): while automation is disabled the reducer
      # takes NO action — it posts no result and syncs no labels, so the
      # published projection is FROZEN exactly as it was. (The pure reducer
      # already refuses every event; reconstruct replays history faithfully
      # and returns frozen:true. This gate ensures the workflow does not even
      # publish that frozen projection as if it were live activity.)
      #
      # POLICY AUTHORITY: the canonical executable gate (policy-gate.mjs →
      # validatePolicy) validates the COMPLETE committed policy and decides
      # on LITERAL BOOLEANS. jq raw textual output is never policy
      # authority: it prints the STRING "true" identically to the boolean
      # true, and inspects nothing else about the policy.
      # Exit 0 = valid policy, enabled boolean true → proceed.
      # Exit 3 = valid policy, enabled boolean false → valid kill switch,
      #          take no action.
      # Any other exit = malformed policy → FAIL CLOSED loudly; a malformed
      # policy is neither enabled nor a valid kill switch.
      - name: Kill switch check (canonical policy gate)
        id: killswitch
        run: |
          set -euo pipefail
          set +e
          node .straylight/bin/policy-gate.mjs
          GATE=$?
          set -e
          if [[ "$GATE" -eq 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GATE" -eq 3 ]]; then
            echo "Automation disabled (valid kill switch). Reducer taking no action; projection frozen."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::automation policy failed validation (policy-gate exit ${GATE}); failing closed — a malformed policy is neither enabled nor a valid kill switch"
            exit 1
          fi

      - name: Fetch lane content (untrusted, to file)
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Bodies go straight from the API into JSON files. No body content
          # is ever expanded by the shell.
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" > /tmp/issue.json
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate > /tmp/comments.json
          # created_at + updated_at both captured: an edited protocol comment
          # (updated_at > created_at) is routed to operator-required (R5).
          jq -n \
            --slurpfile issue /tmp/issue.json \
            --slurpfile comments /tmp/comments.json \
            '{
              issue_body: $issue[0].body,
              comments: ($comments | add // [] | map({id: .id, user: .user.login, body: .body, created_at: .created_at, updated_at: .updated_at}))
            }' > /tmp/reducer-input.json

      - name: Reduce lane
        id: reduce
        if: steps.killswitch.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node .straylight/bin/reduce-issue.mjs --input /tmp/reducer-input.json > /tmp/reducer-result.json || true
          cat /tmp/reducer-result.json

      - name: Confirm eligibility with durable live PR metadata
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # An ACCEPT audit parks the lane in eligibility-pending. This step is
          # the ONLY producer of ready-for-merge: it fetches the complete live
          # PR metadata and posts a system.eligibility_confirmed EVENT with the
          # checked metadata EMBEDDED DURABLY in the event payload. The pure
          # reducer re-validates every embedded field against the lane on every
          # replay, so metadata-free replay can never mint ready-for-merge and
          # a confirmation is exactly as trustworthy as its durable record.
          #
          # Fail closed: a failed fetch, a non-boolean draft/merged, or any
          # missing field posts NOTHING (the lane stays eligibility-pending;
          # the watchdog escalates it if it stays stuck).
          #
          # MUTATION GUARD: posting a confirmation requires an authoritative
          # reconstruction — ok LITERAL boolean true AND frozen LITERAL
          # boolean false (jq == is type-strict: the string "true" never
          # passes). A failed or frozen reconstruction confirms nothing.
          jq -e '(.ok == true) and (.frozen == false)' /tmp/reducer-result.json >/dev/null || {
            echo "reconstruction not ok/unfrozen; posting no confirmation (fail closed)"; exit 0; }
          STATE=$(jq -r '.lane.state // empty' /tmp/reducer-result.json)
          [[ "$STATE" == "eligibility-pending" ]] || { echo "lane not eligibility-pending; no confirmation to post"; exit 0; }
          LANE_ID=$(jq -r '.lane.lane_id' /tmp/reducer-result.json)
          SEQ=$(jq -r '.lane.event_sequence' /tmp/reducer-result.json)
          PR=$(jq -r '.lane.pr_number // empty' /tmp/reducer-result.json)
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "no PR recorded; cannot confirm (fail closed)"; exit 0; }
          if ! gh api "repos/${REPO}/pulls/${PR}" > /tmp/pr.json 2>/dev/null; then
            echo "live PR fetch failed; posting nothing (fail closed, lane stays pending)"
            exit 0
          fi
          # Normalize WITHOUT defaulting: draft/merged must be OBSERVED
          # booleans. A missing/non-boolean field yields fetch_ok:false and
          # nothing is posted — unknown is preserved as unknown, never
          # converted to false.
          jq --arg repo "$REPO" '
            . as $p
            | if (($p.draft|type) == "boolean" and ($p.merged|type) == "boolean"
                  and (($p.number)|type) == "number" and (($p.state)|type) == "string"
                  and (($p.base.ref)|type) == "string" and (($p.base.sha)|type) == "string"
                  and (($p.head.ref)|type) == "string" and (($p.head.sha)|type) == "string")
              then {
                fetch_ok: true,
                repository: $repo,
                pr_number: $p.number,
                state: $p.state,
                draft: $p.draft,
                merged: $p.merged,
                base_branch: $p.base.ref,
                base_sha: $p.base.sha,
                head_branch: $p.head.ref,
                head_sha: $p.head.sha
              }
              else { fetch_ok: false }
              end' /tmp/pr.json > /tmp/pr-meta.json
          [[ "$(jq -r '.fetch_ok' /tmp/pr-meta.json)" == "true" ]] || {
            echo "live PR metadata incomplete; posting nothing (fail closed)"; exit 0; }
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NEXT=$((SEQ + 1))
          DEDUPE="eligibility-confirmed:${LANE_ID}:${SEQ}"
          # Collision-resistant deterministic event id: sha256 over the FULL
          # dedupe key (never a truncation of it).
          EVENT_ID="evt-$(printf '%s' "$DEDUPE" | sha256sum | cut -c1-48)"
          # Idempotency: only a bot-authored event-marker comment counts.
          if gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | test("<!-- straylight:event:v1 -->")) | .body' \
              | grep -qF "dedupe:${DEDUPE}"; then
            echo "confirmation already posted for ${DEDUPE}; skipping"
            exit 0
          fi
          jq -n --slurpfile meta /tmp/pr-meta.json \
            --arg id "$EVENT_ID" --arg lane "$LANE_ID" --argjson seq "$NEXT" --arg now "$NOW" '
            {
              schema: "straylight.event.v1",
              event_id: $id,
              lane_id: $lane,
              sequence: $seq,
              actor_role: "system",
              github_actor: "github-actions[bot]",
              event_type: "system.eligibility_confirmed",
              prior_state: "eligibility-pending",
              occurred_at: $now,
              pr_metadata: $meta[0]
            }' > /tmp/confirm-event.json
          {
            echo "## Straylight eligibility confirmation (shadow mode)"
            echo ""
            echo "dedupe:${DEDUPE}"
            echo ""
            echo "<!-- straylight:event:v1 -->"
            echo '```json'
            cat /tmp/confirm-event.json
            echo '```'
            echo ""
            echo "_Live PR metadata checked and recorded durably above. Nothing merges; merge remains an exclusive operator action._"
          } > /tmp/confirm-comment.md
          # DRY-RUN before posting: append the candidate confirmation to the
          # fetched stream and re-reduce. Post ONLY if the pure reducer would
          # APPLY it. A confirmation that would be refused (draft PR, moved
          # head, retargeted base…) is NOT posted — the lane stays pending and
          # a LATER run retries with the same dedupe key once the PR is fixed.
          # Posting a doomed event would permanently burn the dedupe key for
          # this sequence and park the lane (liveness, not just safety).
          MAXID=$(jq '[.comments[].id] | max // 0' /tmp/reducer-input.json)
          jq --rawfile body /tmp/confirm-comment.md --argjson id "$((MAXID + 1))" --arg now "$NOW" \
            '.comments += [{id: $id, user: "github-actions[bot]", body: $body, created_at: $now, updated_at: $now}]' \
            /tmp/reducer-input.json > /tmp/dryrun-input.json
          node .straylight/bin/reduce-issue.mjs --input /tmp/dryrun-input.json > /tmp/dryrun-result.json || true
          DRYSTATE=$(jq -r '.lane.state // empty' /tmp/dryrun-result.json)
          if [[ "$DRYSTATE" != "ready-for-merge" ]]; then
            echo "dry-run: confirmation would be refused (lane stays ${DRYSTATE:-unreadable}); posting nothing (fail closed, retry next run)"
            jq -r '.dispositions[-1] // empty' /tmp/dryrun-result.json || true
            exit 0
          fi
          gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --input <(jq -n --rawfile body /tmp/confirm-comment.md '{body: $body}')
          echo "posted ${DEDUPE}"
          # Re-fetch and re-reduce so this run's labels/result reflect the
          # confirmation we just posted.
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" > /tmp/issue.json
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate > /tmp/comments.json
          jq -n \
            --slurpfile issue /tmp/issue.json \
            --slurpfile comments /tmp/comments.json \
            '{
              issue_body: $issue[0].body,
              comments: ($comments | add // [] | map({id: .id, user: .user.login, body: .body, created_at: .created_at, updated_at: .updated_at}))
            }' > /tmp/reducer-input.json
          node .straylight/bin/reduce-issue.mjs --input /tmp/reducer-input.json > /tmp/reducer-result.json || true
          cat /tmp/reducer-result.json

      - name: Sync derived labels
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # MUTATION GUARD: labels are synced only from an authoritative
          # reconstruction — ok LITERAL boolean true AND frozen LITERAL
          # boolean false (jq == is type-strict). A failed reconstruction has
          # no trustworthy projection; a frozen one must not be republished
          # as live activity.
          jq -e '(.ok == true) and (.frozen == false)' /tmp/reducer-result.json >/dev/null || {
            echo "reconstruction not ok/unfrozen; labels untouched (fail closed)"; exit 0; }
          # Desired cp-* labels come from the pure deriveLabels projection.
          mapfile -t WANT < <(jq -r '.labels[]' /tmp/reducer-result.json)
          mapfile -t HAVE < <(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/labels" \
            -q '.[].name' | grep -E '^cp-' || true)
          for l in "${HAVE[@]:-}"; do
            [[ -z "$l" || "$l" == "cp-lane" ]] && continue
            if ! printf '%s\n' "${WANT[@]}" | grep -qxF -- "$l"; then
              # Labels are derived projections, never authority. If someone
              # hand-added cp-paused expecting it to pause the lane, warn
              # loudly before stripping it: pausing requires an
              # operator.paused EVENT (ADR-050 §4).
              if [[ "$l" == "cp-paused" ]]; then
                WARN="⚠️ The \`cp-paused\` label was added by hand but labels are derived state, not authority — it has been removed and the lane is NOT paused. To pause this lane, post an \`operator.paused\` event comment (see \`.straylight/README.md\`), or disable all automation via \`.straylight/automation-policy.json\` → \`enabled: false\`."
                gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
                  --input <(jq -n --arg body "$WARN" '{body: $body}') || true
              fi
              gh api -X DELETE "repos/${REPO}/issues/${ISSUE_NUMBER}/labels/$(jq -rn --arg v "$l" '$v|@uri')" || true
            fi
          done
          for l in "${WANT[@]:-}"; do
            [[ -z "$l" ]] && continue
            printf '%s\n' "${HAVE[@]:-}" | grep -qxF -- "$l" || \
              gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/labels" \
                --input <(jq -n --arg l "$l" '{labels: [$l]}') || true
          done

      - name: Post reducer result (idempotent per event_sequence)
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # MUTATION GUARD: a result comment is published only from an
          # authoritative reconstruction — ok LITERAL boolean true AND frozen
          # LITERAL boolean false (jq == is type-strict). A malformed or
          # frozen reconstruction publishes nothing.
          jq -e '(.ok == true) and (.frozen == false)' /tmp/reducer-result.json >/dev/null || {
            echo "reconstruction not ok/unfrozen; posting no result (fail closed)"; exit 0; }
          SEQ=$(jq -r '.lane.event_sequence // "invalid"' /tmp/reducer-result.json)
          STATE=$(jq -r '.lane.state // "invalid"' /tmp/reducer-result.json)
          DEDUPE="reducer-result:${SEQ}:${STATE}"
          # Idempotency: if a result for this exact sequence+state was already
          # posted, do not post another. Only a genuine bot-authored
          # reducer-result comment counts — restrict the scan to
          # github-actions[bot] authorship AND the reducer-result marker so a
          # third party cannot suppress result posting by planting the dedupe
          # string in an ordinary comment (B8 uniform hardening).
          if gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | test("<!-- straylight:reducer-result:v1 -->")) | .body' \
              | grep -qF "dedupe:${DEDUPE}"; then
            echo "result already posted for ${DEDUPE}; skipping"
            exit 0
          fi
          {
            echo "## Straylight reducer result (shadow mode)"
            echo ""
            echo "State: \`${STATE}\` · next actor: \`$(jq -r '.lane.next_actor // "n/a"' /tmp/reducer-result.json)\` · sequence: \`${SEQ}\`"
            echo ""
            echo "<!-- straylight:reducer-result:v1 -->"
            echo '```json'
            jq --arg d "dedupe:${DEDUPE}" '{dedupe: $d, ok, labels, lane: (.lane | {lane_id, state, next_actor, event_sequence, pr_number, pr_head_sha, audited_sha, verdict, patch_cycle, operator_pause}), dispositions}' /tmp/reducer-result.json
            echo '```'
            echo ""
            echo "_Mechanical reduction only. No semantic decision. Nothing merges. Kill switch: \`.straylight/automation-policy.json\` → \`enabled: false\`._"
          } > /tmp/result-comment.md
          gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --input <(jq -n --rawfile body /tmp/result-comment.md '{body: $body}')
