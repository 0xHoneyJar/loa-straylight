# Straylight Control Plane v1 — reducer (shadow mode).
#
# Authority: docs/decisions/ADR-050-autonomous-execution-control-plane.md
# Protocol:  .straylight/README.md
#
# Mechanical only: fetches the lane issue + comments via the GitHub API,
# runs the pure reducer, syncs derived cp-* labels, and posts a
# machine-readable reducer result. Makes NO semantic decisions, calls NO
# model API, and holds NO contents:write.
#
# Security posture:
#   - permissions: contents:read + issues:write + pull-requests:read only
#     (documented below);
#   - issue/comment bodies are UNTRUSTED: they travel API -> jq -> file ->
#     Node JSON.parse; they are never interpolated into shell commands;
#   - first-party actions pinned to immutable commit SHAs;
#   - triggers avoid the privileged PR-target event class entirely;
#   - concurrency per issue so two reducer runs cannot race one lane.

name: Straylight CP Reducer

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Lane issue number to reduce"
        required: true

# contents:read       — checkout of .straylight/ protocol code (and .loa
#                       submodule for repo consistency; no Loa script runs).
# issues:write        — sync derived cp-* labels + post the reducer result.
# pull-requests:read  — read the lane PR's live head SHA for exact-SHA audit
#                       binding (read-only; the reducer fails closed without
#                       it, but head verification then cannot function).
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: straylight-reducer-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  reduce:
    # Only lanes: cp-lane label (or explicit manual dispatch). Bots' own
    # result comments carry no straylight:event marker, so reducing on them
    # is a no-op, but skip github-actions comments outright to avoid loops.
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'cp-lane')) ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.issue.labels.*.name, 'cp-lane') &&
       github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Repo convention (issue #669): keep recursive submodule checkout
          # so .claude symlinks into .loa never dangle on runners.
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Kill switch (ADR-050 §4): while automation is disabled the reducer
      # takes NO action — it posts no result and syncs no labels, so the
      # published projection is FROZEN exactly as it was. (The pure reducer
      # already refuses every event; reconstruct replays history faithfully
      # and returns frozen:true. This gate ensures the workflow does not even
      # publish that frozen projection as if it were live activity.)
      - name: Kill switch check
        id: killswitch
        run: |
          set -euo pipefail
          if [[ "$(jq -r '.enabled' .straylight/automation-policy.json)" != "true" ]]; then
            echo "Automation disabled (kill switch). Reducer taking no action; projection frozen."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch lane content (untrusted, to file)
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Bodies go straight from the API into JSON files. No body content
          # is ever expanded by the shell.
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" > /tmp/issue.json
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate > /tmp/comments.json
          # created_at + updated_at both captured: an edited protocol comment
          # (updated_at > created_at) is routed to operator-required (R5).
          jq -n \
            --slurpfile issue /tmp/issue.json \
            --slurpfile comments /tmp/comments.json \
            '{
              issue_body: $issue[0].body,
              comments: ($comments | add // [] | map({id: .id, user: .user.login, body: .body, created_at: .created_at, updated_at: .updated_at}))
            }' > /tmp/reducer-input.json

      - name: Attach authoritative live PR metadata (fail closed if absent)
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # If the lane names a PR, attach the normalized authoritative live PR
          # metadata object so the reducer can bind an ACCEPT to live truth
          # (R1). A failed/partial fetch yields {fetch_ok:false}, on which the
          # reducer fails closed at the audit frontier. pr_head_sha is kept for
          # the non-frontier / legacy fallback path.
          PR=$(node .straylight/bin/reduce-issue.mjs --input /tmp/reducer-input.json 2>/dev/null \
               | jq -r '.lane.pr_number // empty' || true)
          if [[ "$PR" =~ ^[0-9]+$ ]]; then
            if gh api "repos/${REPO}/pulls/${PR}" > /tmp/pr.json 2>/dev/null; then
              jq -n --arg repo "$REPO" --slurpfile pr /tmp/pr.json '
                ($pr[0]) as $p
                | {
                    fetch_ok: true,
                    repository: $repo,
                    pr_number: $p.number,
                    state: $p.state,
                    draft: ($p.draft // false),
                    merged: ($p.merged // false),
                    base_branch: $p.base.ref,
                    base_sha: $p.base.sha,
                    head_branch: $p.head.ref,
                    head_sha: $p.head.sha
                  }' > /tmp/pr-meta.json
            else
              echo '{"fetch_ok": false}' > /tmp/pr-meta.json
            fi
            HEAD=$(jq -r '.head_sha // empty' /tmp/pr-meta.json)
            jq --slurpfile meta /tmp/pr-meta.json --arg head "$HEAD" '
              .context = ({pr_metadata: $meta[0]}
                          + (if ($head | test("^[0-9a-f]{40}$")) then {pr_head_sha: $head} else {} end))' \
              /tmp/reducer-input.json > /tmp/reducer-input2.json
            mv /tmp/reducer-input2.json /tmp/reducer-input.json
          fi

      - name: Reduce lane
        id: reduce
        if: steps.killswitch.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          node .straylight/bin/reduce-issue.mjs --input /tmp/reducer-input.json > /tmp/reducer-result.json || true
          cat /tmp/reducer-result.json

      - name: Sync derived labels
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OK=$(jq -r '.ok' /tmp/reducer-result.json)
          [[ "$OK" == "true" ]] || { echo "reduction failed closed; labels untouched"; exit 0; }
          # Desired cp-* labels come from the pure deriveLabels projection.
          mapfile -t WANT < <(jq -r '.labels[]' /tmp/reducer-result.json)
          mapfile -t HAVE < <(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/labels" \
            -q '.[].name' | grep -E '^cp-' || true)
          for l in "${HAVE[@]:-}"; do
            [[ -z "$l" || "$l" == "cp-lane" ]] && continue
            if ! printf '%s\n' "${WANT[@]}" | grep -qxF -- "$l"; then
              # Labels are derived projections, never authority. If someone
              # hand-added cp-paused expecting it to pause the lane, warn
              # loudly before stripping it: pausing requires an
              # operator.paused EVENT (ADR-050 §4).
              if [[ "$l" == "cp-paused" ]]; then
                WARN="⚠️ The \`cp-paused\` label was added by hand but labels are derived state, not authority — it has been removed and the lane is NOT paused. To pause this lane, post an \`operator.paused\` event comment (see \`.straylight/README.md\`), or disable all automation via \`.straylight/automation-policy.json\` → \`enabled: false\`."
                gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
                  --input <(jq -n --arg body "$WARN" '{body: $body}') || true
              fi
              gh api -X DELETE "repos/${REPO}/issues/${ISSUE_NUMBER}/labels/$(jq -rn --arg v "$l" '$v|@uri')" || true
            fi
          done
          for l in "${WANT[@]:-}"; do
            [[ -z "$l" ]] && continue
            printf '%s\n' "${HAVE[@]:-}" | grep -qxF -- "$l" || \
              gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/labels" \
                --input <(jq -n --arg l "$l" '{labels: [$l]}') || true
          done

      - name: Post reducer result (idempotent per event_sequence)
        if: steps.killswitch.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SEQ=$(jq -r '.lane.event_sequence // "invalid"' /tmp/reducer-result.json)
          STATE=$(jq -r '.lane.state // "invalid"' /tmp/reducer-result.json)
          DEDUPE="reducer-result:${SEQ}:${STATE}"
          # Idempotency: if a result for this exact sequence+state was already
          # posted, do not post another. Only a genuine bot-authored
          # reducer-result comment counts — restrict the scan to
          # github-actions[bot] authorship AND the reducer-result marker so a
          # third party cannot suppress result posting by planting the dedupe
          # string in an ordinary comment (B8 uniform hardening).
          if gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | test("<!-- straylight:reducer-result:v1 -->")) | .body' \
              | grep -qF "dedupe:${DEDUPE}"; then
            echo "result already posted for ${DEDUPE}; skipping"
            exit 0
          fi
          {
            echo "## Straylight reducer result (shadow mode)"
            echo ""
            echo "State: \`${STATE}\` · next actor: \`$(jq -r '.lane.next_actor // "n/a"' /tmp/reducer-result.json)\` · sequence: \`${SEQ}\`"
            echo ""
            echo "<!-- straylight:reducer-result:v1 -->"
            echo '```json'
            jq --arg d "dedupe:${DEDUPE}" '{dedupe: $d, ok, labels, lane: (.lane | {lane_id, state, next_actor, event_sequence, pr_number, pr_head_sha, audited_sha, verdict, patch_cycle, operator_pause}), dispositions}' /tmp/reducer-result.json
            echo '```'
            echo ""
            echo "_Mechanical reduction only. No semantic decision. Nothing merges. Kill switch: \`.straylight/automation-policy.json\` → \`enabled: false\`._"
          } > /tmp/result-comment.md
          gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            --input <(jq -n --rawfile body /tmp/result-comment.md '{body: $body}')
