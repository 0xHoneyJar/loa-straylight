# Straylight Control Plane v1 — Phase 49P shadow-lane bootstrap.
#
# Authority: docs/decisions/ADR-050-autonomous-execution-control-plane.md §7.1
#
# Manual, idempotent: creates AT MOST ONE Phase 49P lane issue. It does
# NOT implement Phase 49P, does NOT open an implementation PR, does NOT
# invoke any model API, and does NOT merge anything. Run it once after
# the control-plane PR merges; re-running is a no-op.
#
# WORKFLOW-BOUNDARY CONTRACT (rev. 3 §11): bash here is confined to
# fetching bytes to files, switching on validated exit codes, and
# invoking the two Node entry points (planner, executor). Bash never
# constructs a write request, never interprets evidence content, and
# never calls `gh api -X POST/PATCH/DELETE` directly. All authority lives
# in the planner (plan-bootstrap-write.mjs — evidence parsing, N1/N2
# binding, the universal lane-ABSENCE proof, genesis validation) and the
# shared secure executor (execute-write-plan.mjs — O_NOFOLLOW
# read-once/hash/retain, fixed argv, stdin bytes, exit 2 = zero writes).
#
# Planner exit semantics: 0 = absence proven, plan written → execute.
# 3 = the lane exists exactly once → valid no-op. 2 = ANY ambiguity
# (duplicate lane IDs anywhere, unreadable genesis bodies, malformed
# pages/labels, invalid base SHA) → fail closed, zero writes.

name: Straylight CP Bootstrap (Phase 49P lane)

on:
  workflow_dispatch: {}

# contents:read — read base SHA + protocol code. issues:write — create the
# lane issue and its labels (used ONLY through the shared executor).
permissions:
  contents: read
  issues: write

concurrency:
  group: straylight-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Pin to main, NOT the dispatched ref: bootstrap must run the
          # protocol validator and resolve the lane base from main, never
          # from an attacker-selectable dispatch ref (B10 hardening). The
          # base SHA is additionally re-resolved from origin/main below.
          ref: main
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # POLICY AUTHORITY: the canonical executable gate (policy-gate.mjs →
      # validatePolicy) validates the COMPLETE committed policy and decides
      # on LITERAL BOOLEANS — jq raw textual output is never policy
      # authority. Bootstrap MUTATES, so ONLY exit 0 (valid policy, enabled
      # boolean true) may proceed: a valid kill switch (exit 3) refuses,
      # and a malformed policy (any other exit) fails closed.
      - name: Kill switch check (canonical policy gate)
        run: |
          set -euo pipefail
          set +e
          node .straylight/bin/policy-gate.mjs
          GATE=$?
          set -e
          if [[ "$GATE" -eq 3 ]]; then
            echo "Automation disabled (valid kill switch). Refusing to bootstrap."
            exit 1
          elif [[ "$GATE" -ne 0 ]]; then
            echo "::error::automation policy failed validation (policy-gate exit ${GATE}); refusing to bootstrap — a malformed policy is neither enabled nor a valid kill switch"
            exit 1
          fi

      # FETCH ONLY: raw bytes to files. The enumeration is
      # label-independent across ALL issues (open AND closed — a closed
      # lane is a completed lane, not permission to duplicate it); the
      # planner owns flattening, strict parsing, PR exclusion, N1
      # uniqueness, and the lane-absence proof, all fail-closed. A failed
      # listing call aborts loudly — never "zero lanes".
      - name: Fetch evidence (raw bytes to files)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api --paginate "repos/${REPO}/issues?state=all&per_page=100" \
              > /tmp/issue-pages.json; then
            echo "::error::lane enumeration failed (gh api non-zero); refusing to bootstrap — NOT treating as zero lanes"
            exit 1
          fi
          if ! gh api --paginate "repos/${REPO}/labels?per_page=100" \
              > /tmp/label-pages.json; then
            echo "::error::label enumeration failed (gh api non-zero); refusing to bootstrap — NOT treating as no labels"
            exit 1
          fi
          # Resolve the base SHA from origin/main explicitly — NOT from the
          # dispatched checkout ref. `set -euo pipefail` fails the step
          # closed if the fetch or rev-parse fails, so a lane is never
          # created against an unverifiable base. The planner re-validates
          # the SHA shape and embeds it in the reducer-validated genesis.
          git fetch --no-tags --depth=1 origin main
          git rev-parse FETCH_HEAD > /tmp/base-sha.txt

      # PLAN: the planner performs the universal lane-ABSENCE proof over
      # the complete enumeration and authors the write plan. Exit 3 is a
      # valid no-op (the lane exists exactly once); exit 2 is any
      # ambiguity — duplicate lane IDs, unreadable marker-bearing bodies,
      # malformed evidence — and fails the job with zero writes.
      - name: Plan bootstrap write (planner authority)
        id: plan
        env:
          REPO: ${{ github.repository }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          REQUEST_ROOT=$(mktemp -d)
          echo "request_root=${REQUEST_ROOT}" >> "$GITHUB_OUTPUT"
          set +e
          node .straylight/bin/plan-bootstrap-write.mjs \
            --pages /tmp/issue-pages.json \
            --labels /tmp/label-pages.json \
            --base-sha "$(cat /tmp/base-sha.txt)" \
            --request-root "${REQUEST_ROOT}" \
            --repository "${REPO}" \
            --nonce "${NONCE}"
          PLAN=$?
          set -e
          if [[ "$PLAN" -eq 3 ]]; then
            echo "Phase 49P lane already exists; bootstrap is a no-op."
            echo "outcome=noop" >> "$GITHUB_OUTPUT"
          elif [[ "$PLAN" -eq 0 ]]; then
            echo "outcome=plan" >> "$GITHUB_OUTPUT"
          else
            echo "::error::bootstrap planner refused (exit ${PLAN}); failing closed — zero writes"
            exit 1
          fi

      # EXECUTE: one invocation of the shared secure executor per plan.
      # Exit 2 = validation refusal, zero gh launches guaranteed; exit 4 =
      # execution began and a failure occurred (recovery = a fresh run;
      # the absence proof then finds whatever landed). Both fail the job.
      - name: Execute write plan (single shared executor)
        if: steps.plan.outputs.outcome == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          REQUEST_ROOT: ${{ steps.plan.outputs.request_root }}
        run: |
          set -euo pipefail
          node .straylight/bin/execute-write-plan.mjs \
            --plan "${REQUEST_ROOT}/plan.json" \
            --request-root "${REQUEST_ROOT}" \
            --repository "${REPO}" \
            --nonce "${NONCE}"
          echo "Phase 49P shadow lane created."
